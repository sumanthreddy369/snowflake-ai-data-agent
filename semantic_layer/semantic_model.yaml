name: bank_agent_semantic_model
description: >
  Semantic model over the BANK_AGENT.GOLD star schema, letting Cortex Analyst
  answer plain-English questions about card transactions, customers, and
  merchants with agreed-upon definitions for common business terms like
  "spend", "fraud rate", and "active customer".

tables:
  - name: fct_transactions
    base_table:
      database: BANK_AGENT
      schema: GOLD
      table: FCT_TRANSACTIONS
    primary_key:
      columns: [transaction_id]
    dimensions:
      - name: transaction_status
        expr: transaction_status
        data_type: varchar
        description: "Status of the transaction (e.g. APPROVED, DECLINED, REVERSED)."
      - name: is_fraud
        expr: is_fraud
        data_type: boolean
        description: "Whether the transaction was flagged as fraudulent."
      - name: transaction_date
        expr: date_key
        data_type: date
        description: "Calendar date the transaction occurred."
    time_dimensions:
      - name: transaction_ts
        expr: transaction_ts
        data_type: timestamp
        description: "Exact timestamp the transaction was authorized."
    facts:
      - name: amount
        expr: amount
        data_type: number
        description: "Transaction amount in USD."
    measures:
      - name: total_spend
        expr: SUM(amount)
        data_type: number
        description: >
          Total spend: the sum of amount across all non-reversed transactions.
          This is the agreed single definition of "spend" for this agent —
          always net of reversed transactions.
      - name: transaction_count
        expr: COUNT(DISTINCT transaction_id)
        data_type: number
        description: "Number of distinct transactions."
      - name: avg_transaction_amount
        expr: AVG(amount)
        data_type: number
        description: "Average transaction amount."
      - name: fraud_rate
        expr: SUM(IFF(is_fraud, 1, 0)) / NULLIF(COUNT(DISTINCT transaction_id), 0)
        data_type: number
        description: >
          "Fraud rate" is defined here as flagged transactions divided by total
          transactions in the filtered window — never a count alone. Document
          any change to this definition here first.

  - name: dim_customers
    base_table:
      database: BANK_AGENT
      schema: GOLD
      table: DIM_CUSTOMERS
    primary_key:
      columns: [customer_id]
    dimensions:
      - name: full_name
        expr: full_name
        data_type: varchar
      - name: region
        expr: region
        data_type: varchar
        description: "Customer's home region, used for geographic breakdowns."
    time_dimensions:
      - name: account_open_date
        expr: account_open_date
        data_type: date
    measures:
      - name: active_customers
        expr: COUNT(DISTINCT customer_id)
        data_type: number
        description: >
          "Active customer" is defined here as a distinct customer with at least
          one approved (non-declined, non-reversed) transaction in the
          filtered/questioned time window — i.e. this measure is only meaningful
          when joined through fct_transactions and filtered by a date range.

  - name: dim_merchants
    base_table:
      database: BANK_AGENT
      schema: GOLD
      table: DIM_MERCHANTS
    primary_key:
      columns: [merchant_id]
    dimensions:
      - name: merchant_name
        expr: merchant_name
        data_type: varchar
      - name: mcc_category
        expr: mcc_category
        data_type: varchar
        description: "Merchant category, e.g. GROCERY, TRAVEL, ELECTRONICS."
      - name: risk_tier
        expr: risk_tier
        data_type: varchar
        description: "Merchant fraud-risk tier: LOW, MEDIUM, or HIGH."

relationships:
  - name: transactions_to_customers
    left_table: fct_transactions
    right_table: dim_customers
    relationship_columns:
      - left_column: customer_id
        right_column: customer_id
    join_type: left_outer
    relationship_type: many_to_one

  - name: transactions_to_merchants
    left_table: fct_transactions
    right_table: dim_merchants
    relationship_columns:
      - left_column: merchant_id
        right_column: merchant_id
    join_type: left_outer
    relationship_type: many_to_one

verified_queries:
  - name: total_spend_last_30_days
    question: "What was our total spend in the last 30 days?"
    sql: >
      SELECT SUM(amount) AS total_spend
      FROM BANK_AGENT.GOLD.FCT_TRANSACTIONS
      WHERE transaction_ts >= DATEADD('day', -30, CURRENT_DATE())
        AND transaction_status != 'REVERSED';
    use_as_onboarding_question: true

  - name: fraud_rate_by_merchant_category
    question: "What is our fraud rate by merchant category this month?"
    sql: >
      SELECT m.mcc_category,
             SUM(IFF(t.is_fraud, 1, 0)) / COUNT(DISTINCT t.transaction_id) AS fraud_rate
      FROM BANK_AGENT.GOLD.FCT_TRANSACTIONS t
      JOIN BANK_AGENT.GOLD.DIM_MERCHANTS m ON t.merchant_id = m.merchant_id
      WHERE DATE_TRUNC('month', t.transaction_ts) = DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY m.mcc_category
      ORDER BY fraud_rate DESC;

  - name: active_customers_by_region
    question: "How many active customers do we have in each region this month?"
    sql: >
      SELECT c.region, COUNT(DISTINCT t.customer_id) AS active_customers
      FROM BANK_AGENT.GOLD.FCT_TRANSACTIONS t
      JOIN BANK_AGENT.GOLD.DIM_CUSTOMERS c ON t.customer_id = c.customer_id
      WHERE DATE_TRUNC('month', t.transaction_ts) = DATE_TRUNC('month', CURRENT_DATE())
        AND t.transaction_status = 'APPROVED'
      GROUP BY c.region
      ORDER BY active_customers DESC;
