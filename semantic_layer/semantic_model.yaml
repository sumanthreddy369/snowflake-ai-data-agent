name: market_agent_semantic_model
description: >
  Semantic model over the MARKET_AGENT.GOLD star schema, letting Cortex Analyst
  answer plain-English questions about real-time equities trades and minute
  bars with agreed-upon definitions for "return", "volatility", and "volume".
  Rows visible to this model are already subject to the delayed-data row
  access policy in sql/07_governance — see that file before assuming any
  answer reflects true real-time prices.

tables:
  - name: fct_bars
    base_table:
      database: MARKET_AGENT
      schema: GOLD
      table: FCT_BARS
    dimensions:
      - name: symbol
        expr: symbol
        data_type: varchar
        description: "Ticker symbol, e.g. AAPL."
      - name: bar_date
        expr: date_key
        data_type: date
        description: "Calendar date the bar occurred."
    time_dimensions:
      - name: bar_ts
        expr: bar_ts
        data_type: timestamp
        description: "Start timestamp of the 1-minute bar."
    facts:
      - name: open
        expr: open
        data_type: number
      - name: high
        expr: high
        data_type: number
      - name: low
        expr: low
        data_type: number
      - name: close
        expr: close
        data_type: number
      - name: volume
        expr: volume
        data_type: number
      - name: bar_return
        expr: bar_return
        data_type: number
        description: "(close - open) / open for this single bar."
    measures:
      - name: total_volume
        expr: SUM(volume)
        data_type: number
        description: "Total shares traded across the filtered bars."
      - name: avg_close
        expr: AVG(close)
        data_type: number
        description: "Average closing price across the filtered bars."
      - name: vwap
        expr: SUM(vwap * volume) / NULLIF(SUM(volume), 0)
        data_type: number
        description: >
          "VWAP" (volume-weighted average price) is defined here as the
          volume-weighted mean of each bar's own vwap field — never a plain
          average of price, which would ignore how much actually traded at
          each level.
      - name: period_return
        expr: (MAX_BY(close, bar_ts) - MIN_BY(open, bar_ts)) / NULLIF(MIN_BY(open, bar_ts), 0)
        data_type: number
        description: >
          "Return" over a filtered window is defined here as the last close
          minus the first open, divided by the first open — never an average
          of per-bar returns, which would not reconstruct the actual
          start-to-end price move.
      - name: volatility
        expr: AVG(rolling_volatility_30)
        data_type: number
        description: >
          "Volatility" is defined here as the average of each bar's trailing
          30-bar return standard deviation (computed once in dbt, see
          fct_bars.sql) — never a single global stddev of the filtered rows,
          which would blend calm and turbulent periods together.

  - name: fct_trades
    base_table:
      database: MARKET_AGENT
      schema: GOLD
      table: FCT_TRADES
    primary_key:
      columns: [trade_id]
    dimensions:
      - name: symbol
        expr: symbol
        data_type: varchar
      - name: exchange_code
        expr: exchange_code
        data_type: varchar
    time_dimensions:
      - name: trade_ts
        expr: trade_ts
        data_type: timestamp
    facts:
      - name: price
        expr: price
        data_type: number
      - name: size
        expr: size
        data_type: number
      - name: notional
        expr: notional
        data_type: number
        description: "price * size for this single trade print."
    measures:
      - name: trade_count
        expr: COUNT(DISTINCT trade_id)
        data_type: number
      - name: total_notional
        expr: SUM(notional)
        data_type: number
        description: "Total dollar value traded across the filtered trades."
      - name: avg_trade_size
        expr: AVG(size)
        data_type: number

  - name: dim_symbols
    base_table:
      database: MARKET_AGENT
      schema: GOLD
      table: DIM_SYMBOLS
    primary_key:
      columns: [symbol]
    dimensions:
      - name: company_name
        expr: company_name
        data_type: varchar
      - name: sector
        expr: sector
        data_type: varchar
      - name: exchange
        expr: exchange
        data_type: varchar

relationships:
  - name: bars_to_symbols
    left_table: fct_bars
    right_table: dim_symbols
    relationship_columns:
      - left_column: symbol
        right_column: symbol
    join_type: left_outer
    relationship_type: many_to_one

  - name: trades_to_symbols
    left_table: fct_trades
    right_table: dim_symbols
    relationship_columns:
      - left_column: symbol
        right_column: symbol
    join_type: left_outer
    relationship_type: many_to_one

verified_queries:
  - name: todays_return_by_symbol
    question: "What was today's return for AAPL?"
    sql: >
      SELECT symbol,
             (MAX_BY(close, bar_ts) - MIN_BY(open, bar_ts)) / NULLIF(MIN_BY(open, bar_ts), 0) AS period_return
      FROM MARKET_AGENT.GOLD.FCT_BARS
      WHERE symbol = 'AAPL' AND date_key = CURRENT_DATE()
      GROUP BY symbol;
    use_as_onboarding_question: true

  - name: highest_volatility_symbols_today
    question: "Which symbols were most volatile today?"
    sql: >
      SELECT symbol, AVG(rolling_volatility_30) AS volatility
      FROM MARKET_AGENT.GOLD.FCT_BARS
      WHERE date_key = CURRENT_DATE()
      GROUP BY symbol
      ORDER BY volatility DESC
      LIMIT 10;

  - name: total_volume_by_sector
    question: "What was total trading volume by sector today?"
    sql: >
      SELECT s.sector, SUM(b.volume) AS total_volume
      FROM MARKET_AGENT.GOLD.FCT_BARS b
      JOIN MARKET_AGENT.GOLD.DIM_SYMBOLS s ON b.symbol = s.symbol
      WHERE b.date_key = CURRENT_DATE()
      GROUP BY s.sector
      ORDER BY total_volume DESC;
