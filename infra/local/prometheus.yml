global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  # Application metrics (producer, replay, FastAPI), via the OTel Collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Kafka topic offsets and consumer-group lag.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
