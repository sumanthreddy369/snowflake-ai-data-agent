# Local, free runtime for everything outside Snowflake: Kafka for the live
# path, plus the observability stack that watches it.
#
#   cd infra/local && docker compose up -d
#
#   Kafka            localhost:9092   (producer / replay script connect here)
#   OTel Collector   localhost:14317 (gRPC) / 14318 (HTTP) -- apps send telemetry here
#   Prometheus       http://localhost:9091   metrics + alert rules
#   Grafana          http://localhost:3001   dashboards (3000 is Dagster's UI)
#   Jaeger           http://localhost:16687  traces
#
# Host ports are offset from the defaults (4317/4318, 9090, 16686) so this
# stack can run alongside another project's observability stack. Inside the
# compose network the services still use their standard ports.
#
# Apps: export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:14318
#
# Apps only send telemetry when OTEL_EXPORTER_OTLP_ENDPOINT is set (see
# streaming/telemetry.py), so nothing breaks when this stack isn't running.
# Image versions are pinned so a fresh `up` gives the same stack.

services:
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: localhost:9092 for apps on this machine, kafka:29092 for
      # containers (the exporter, and Kafka Connect later).
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:29092"]
    ports: ["9308:9308"]
    depends_on: [kafka]
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["14317:4317", "14318:4318", "18889:8889"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports: ["16687:16686"]

  prometheus:
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    ports: ["9091:9090"]
    depends_on: [otel-collector, kafka-exporter]

  grafana:
    image: grafana/grafana:12.2.0
    ports: ["3001:3000"]
    environment:
      # Local-only convenience: open dashboards without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, jaeger]
